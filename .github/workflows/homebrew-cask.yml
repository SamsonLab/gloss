name: Update Homebrew cask

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published Gloss release tag
        required: true
        type: string
      download_base_url:
        description: Optional public HTTPS directory containing both architecture archives
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: homebrew-cask-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  update:
    name: Generate and propose cask
    runs-on: macos-15
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download and verify release archives
        run: |
          mkdir -p "$RUNNER_TEMP/gloss-release"
          gh release download "$RELEASE_TAG" \
            --pattern 'Gloss-macos-*.zip' \
            --pattern SHA256SUMS \
            --dir "$RUNNER_TEMP/gloss-release"
          (
            cd "$RUNNER_TEMP/gloss-release"
            grep -E '  Gloss-macos-(arm64|x86_64)\.zip$' SHA256SUMS >ARCHIVE_SHA256SUMS
            [[ "$(wc -l <ARCHIVE_SHA256SUMS | tr -d ' ')" == "2" ]]
            shasum -a 256 --check ARCHIVE_SHA256SUMS
          )
      - name: Generate publishable cask
        env:
          GLOSS_CASK_DOWNLOAD_BASE_URL: ${{ inputs.download_base_url }}
        run: |
          version="${RELEASE_TAG#v}"
          arm64_checksum="$(
            shasum -a 256 "$RUNNER_TEMP/gloss-release/Gloss-macos-arm64.zip" \
              | awk '{print $1}'
          )"
          x86_64_checksum="$(
            shasum -a 256 "$RUNNER_TEMP/gloss-release/Gloss-macos-x86_64.zip" \
              | awk '{print $1}'
          )"
          Scripts/generate_homebrew_cask.sh \
            "$version" \
            "$arm64_checksum" \
            "$x86_64_checksum" \
            "$RUNNER_TEMP/gloss.rb" \
            "$RELEASE_TAG" \
            "$GITHUB_REPOSITORY"
          Scripts/validate_homebrew_cask.sh "$RUNNER_TEMP/gloss.rb"
      - name: Open cask update pull request
        run: |
          version="${RELEASE_TAG#v}"
          branch="automation/homebrew-cask-$(printf '%s' "$version" | tr -c '0-9A-Za-z._-' '-')"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git switch -C "$branch" "origin/$branch"
          else
            git switch -c "$branch"
          fi
          mkdir -p Casks
          cp "$RUNNER_TEMP/gloss.rb" Casks/gloss.rb
          if [[ -z "$(git status --porcelain -- Casks/gloss.rb)" ]]; then
            echo "Cask is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/gloss.rb
          git commit -m "chore: update Homebrew cask to $version"
          git push --set-upstream origin "$branch"
          if [[ -z "$(gh pr list --head "$branch" --json url --jq '.[0].url')" ]]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: update Homebrew cask to $version" \
              --body "Generated and checksum-verified from the published $RELEASE_TAG release."
          fi
