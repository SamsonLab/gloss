name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to package without publishing
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      HAS_DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 != '' }}
      HAS_NOTARY_CREDENTIALS: ${{ secrets.APPLE_NOTARY_PASSWORD != '' }}
    steps:
      - name: Check out Gloss
        uses: actions/checkout@v4
        with:
          path: gloss
          ref: ${{ github.event_name == 'push' && github.ref || inputs.release_tag }}
      - name: Require signing and notarization for published releases
        if: github.event_name == 'push'
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          [[ -n "$CERTIFICATE_BASE64" ]] || missing+=("DEVELOPER_ID_CERTIFICATE_BASE64")
          [[ -n "$CERTIFICATE_PASSWORD" ]] || missing+=("DEVELOPER_ID_CERTIFICATE_PASSWORD")
          [[ -n "$SIGN_IDENTITY" ]] || missing+=("DEVELOPER_ID_APPLICATION")
          [[ -n "$KEYCHAIN_PASSWORD" ]] || missing+=("RELEASE_KEYCHAIN_PASSWORD")
          [[ -n "$APPLE_ID" ]] || missing+=("APPLE_NOTARY_APPLE_ID")
          [[ -n "$APPLE_NOTARY_PASSWORD" ]] || missing+=("APPLE_NOTARY_PASSWORD")
          [[ -n "$APPLE_TEAM_ID" ]] || missing+=("APPLE_TEAM_ID")
          if [[ ${#missing[@]} -ne 0 ]]; then
            printf 'Published releases require secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi
      - name: Check out browser extensions
        uses: actions/checkout@v4
        with:
          repository: SunChJ/personal-immersive-translator
          ref: 3e9c7c8cb75ce4b08e56a714ee0e4eb7ebaa652e
          path: personal-immersive-translator
      - name: Validate release version and runner architecture
        working-directory: gloss
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          version="${RELEASE_TAG#v}"
          plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$version" != "$plist_version" ]]; then
            echo "Tag version $version does not match Info.plist version $plist_version." >&2
            exit 1
          fi
          if [[ "$(uname -m)" != "$EXPECTED_ARCHITECTURE" ]]; then
            echo "Runner architecture $(uname -m) does not match $EXPECTED_ARCHITECTURE." >&2
            exit 1
          fi
      - name: Import Developer ID certificate
        if: env.HAS_DEVELOPER_ID_CERTIFICATE == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/gloss-release.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode >"$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          echo "GLOSS_SIGN_IDENTITY=$SIGN_IDENTITY" >>"$GITHUB_ENV"
      - name: Build Gloss.app
        working-directory: gloss
        run: Scripts/build_app.sh
      - name: Verify app architecture and Developer ID signature
        working-directory: gloss
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          lipo -verify_arch "$EXPECTED_ARCHITECTURE" dist/Gloss.app/Contents/MacOS/Gloss
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            codesign --verify --deep --strict --verbose=2 dist/Gloss.app
            codesign --display --verbose=4 dist/Gloss.app 2>&1 \
              | grep -F "Authority=Developer ID Application:"
          fi
      - name: Notarize and staple
        if: env.HAS_NOTARY_CREDENTIALS == 'true'
        working-directory: gloss
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          /usr/bin/ditto -c -k --keepParent dist/Gloss.app "$RUNNER_TEMP/Gloss-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Gloss-notary.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple dist/Gloss.app
          xcrun stapler validate dist/Gloss.app
      - name: Package architecture-specific app
        working-directory: gloss
        env:
          GLOSS_RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
        run: Scripts/package_release.sh
      - name: Upload architecture artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gloss-${{ matrix.architecture }}
          path: gloss/dist/release/Gloss-macos-${{ matrix.architecture }}.zip
          if-no-files-found: error

  assemble:
    name: Assemble release metadata
    needs:
      - build
    runs-on: macos-15
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - name: Check out Gloss
        uses: actions/checkout@v4
        with:
          path: gloss
          ref: ${{ github.event_name == 'push' && github.ref || inputs.release_tag }}
      - name: Download architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Gloss-*
          path: release-input
          merge-multiple: true
      - name: Generate checksums, manifest, and Homebrew cask
        working-directory: gloss
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist/release
          cp ../release-input/Gloss-macos-arm64.zip dist/release/
          cp ../release-input/Gloss-macos-x86_64.zip dist/release/
          Scripts/generate_release_metadata.sh \
            dist/release/Gloss-macos-arm64.zip \
            dist/release/Gloss-macos-x86_64.zip \
            "$version" \
            dist/release \
            "$RELEASE_TAG" \
            "$GITHUB_REPOSITORY"
      - name: Upload combined workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gloss-release-${{ env.RELEASE_TAG }}
          path: |
            gloss/dist/release/Gloss-macos-arm64.zip
            gloss/dist/release/Gloss-macos-x86_64.zip
            gloss/dist/release/SHA256SUMS
            gloss/dist/release/gloss-release-manifest.json
            gloss/dist/release/Casks/gloss.rb
          if-no-files-found: error
      - name: Publish GitHub release assets
        if: github.event_name == 'push'
        working-directory: gloss
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            dist/release/Gloss-macos-arm64.zip \
            dist/release/Gloss-macos-x86_64.zip \
            dist/release/SHA256SUMS \
            dist/release/gloss-release-manifest.json \
            dist/release/Casks/gloss.rb \
            --clobber
      - name: Start Homebrew cask update
        if: github.event_name == 'push'
        working-directory: gloss
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run homebrew-cask.yml --ref main -f release_tag="$RELEASE_TAG"
